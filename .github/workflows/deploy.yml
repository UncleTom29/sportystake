name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy-vps:
    name: Contabo VPS — full app (frontend + backend + workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Typecheck here first so a broken commit is caught before it reaches
      # the box — deploy/scripts/deploy.sh rebuilds (and typechecks, via
      # `next build`) again on the host itself regardless, which is the
      # real gate: native deps like @prisma/client's query engine need to
      # compile there, not cross-compile on the runner, and deploy.sh's
      # `set -euo pipefail` means a failed build there stops before restart.
      # continue-on-error here because this exact step is currently
      # unreliable on GitHub's ubuntu-latest runner specifically — see
      # ci.yml's matching step for the full writeup — while deploy.sh's own
      # build has run clean on every real deploy so far.
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm typecheck
        continue-on-error: true
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.CONTABO_HOST || secrets.EC2_HOST }}
          VPS_USER: ${{ secrets.CONTABO_USER || secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "sudo -u sportystake bash /opt/sportystake/deploy/scripts/deploy.sh"
