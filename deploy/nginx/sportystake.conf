# SportyStake origin nginx config — sits behind Cloudflare (Full strict TLS).
# Install to /etc/nginx/sites-available/sportystake, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Requires a Cloudflare Origin CA certificate installed at the paths below —
# generate one at Cloudflare dashboard > SSL/TLS > Origin Server.

# Redirect www (HTTPS) -> apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sportystake.com;

    ssl_certificate     /etc/ssl/cloudflare/sportystake.origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sportystake.origin.key;

    return 301 https://sportystake.com$request_uri;
}

# Main site (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sportystake.com;

    ssl_certificate     /etc/ssl/cloudflare/sportystake.origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sportystake.origin.key;

    # /api/socket is Server-Sent Events (src/app/api/socket/route.ts) — the
    # route already sends X-Accel-Buffering: no, this is the matching
    # server-side enforcement so nginx doesn't buffer the stream anyway.
    location /api/socket {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plain HTTP (Port 80) -> HTTPS Apex Redirect
server {
    listen 80;
    listen [::]:80;
    server_name sportystake.com www.sportystake.com;
    return 301 https://sportystake.com$request_uri;
}
