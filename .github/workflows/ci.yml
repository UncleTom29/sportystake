name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-typecheck-lint:
    name: Next.js — typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - name: debug prisma client output
        run: |
          echo "--- prisma/schema.prisma enum count ---"
          grep -c "^enum " prisma/schema.prisma
          echo "--- generated client files ---"
          find node_modules/.prisma/client node_modules/@prisma/client -maxdepth 1 -type f 2>&1
          echo "--- grep for CasinoStatus in generated output ---"
          grep -rl "CasinoStatus" node_modules/.prisma/client node_modules/@prisma/client 2>&1 || echo "NOT FOUND ANYWHERE"
          echo "--- @prisma/client package.json exports field ---"
          cat node_modules/@prisma/client/package.json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(JSON.stringify(d.exports, null, 2))"
      - run: pnpm typecheck
      # Pre-existing lint debt (mostly no-explicit-any) predates this
      # pipeline — surface it without blocking deploys, same treatment as
      # the Slither job below. Tighten once the backlog's cleared.
      - run: pnpm lint
        continue-on-error: true

  oracle:
    name: Oracle — typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/oracle/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test --if-present

  sdk:
    name: SDK — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build --if-present

  contracts:
    name: Contracts — compile + hardhat test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  slither:
    name: Contracts — Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install slither-analyzer==0.10.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: cd packages/contracts && slither . --filter-paths "node_modules|mocks" --fail-medium
        continue-on-error: true # surface findings, don't gate yet
