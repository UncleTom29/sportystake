name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy-vps:
    name: Contabo VPS — full app (frontend + backend + workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Pre-flight check on runner (non-blocking for deploy — the VPS build is the true gate)
      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - run: npx prisma generate
        continue-on-error: true
      - run: pnpm typecheck
        continue-on-error: true
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.CONTABO_HOST || secrets.EC2_HOST }}
          VPS_USER: ${{ secrets.CONTABO_USER || secrets.EC2_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Error: Required deployment secrets (HOST, USER, or PRIVATE_KEY) are missing." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          DEPLOY_CMD="sudo -u sportystake pkill -f 'next build' || true; sudo -u sportystake rm -f /opt/sportystake/.next/lock; sudo -u sportystake bash /opt/sportystake/deploy/scripts/deploy.sh"

          DEPLOYED=false
          for attempt in 1 2 3; do
            echo "Connecting to $VPS_HOST for deployment (attempt $attempt/3)..."
            if ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "$DEPLOY_CMD"; then
              DEPLOYED=true
              break
            fi
            echo "SSH deploy command failed or connection dropped. Retrying in 5s..."
            sleep 5
          done

          if [ "$DEPLOYED" != "true" ]; then
            echo "Deployment failed after 3 attempts" >&2
            exit 1
          fi
